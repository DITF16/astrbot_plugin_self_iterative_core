<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自迭代知识库</title>
<style>body{font-family:system-ui;margin:24px;color:#20372f;background:#f5f7f6}input,textarea,button,select{padding:8px;margin:4px;border:1px solid #ccd8d0;border-radius:5px}textarea{width:100%;min-height:280px}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}.panel{background:#fff;padding:14px;border:1px solid #dfe7e2}.item{padding:10px;border-bottom:1px solid #e5ece7;cursor:pointer}.muted{color:#63786d;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head>
<body><h1>自迭代知识库</h1><p id="status" class="muted">加载中…</p><p><input id="q" placeholder="搜索标题、分类或 key"><button id="search">查询</button><button id="refresh">刷新</button></p><main class="layout"><section class="panel"><div id="list"></div></section><section class="panel"><div id="detail">选择条目查看和修改</div></section></main>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<script>
let bridge;const $=id=>document.getElementById(id);const esc=v=>String(v||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function msg(t){$('status').textContent=t} async function load(){try{const d=await bridge.apiGet('knowledge/entries',{q:$('q').value,page:1});$('list').replaceChildren();d.items.forEach(x=>{const e=document.createElement('div');e.className='item';e.innerHTML='<b>'+esc(x.title)+'</b><div class="muted">'+esc(x.category)+' · '+esc(x.key)+' · '+x.status+' · 修订 '+x.revision+'</div><div>'+esc(x.summary)+'</div>';e.onclick=()=>show(x.id);$('list').append(e)});msg('共 '+d.total+' 条知识')}catch(e){msg(e.message||'读取失败')}} async function show(id){try{const d=await bridge.apiGet('knowledge/entry',{id});const f=document.createElement('form');f.innerHTML='<p><label>Key <input name="key" readonly></label></p><p><label>分类 <input name="category"></label></p><p><label>标题 <input name="title"></label></p><p><label>摘要 <input name="summary"></label></p><p><label>状态 <select name="status"><option>active</option><option>archived</option></select></label></p><p><textarea name="content"></textarea></p><button>保存当前修订</button>';for(const k of ['key','category','title','summary','content','status'])f.elements[k].value=k==='summary'?(d.profile?.summary||''):k==='status'?(d.profile?.status||'active'):(d[k]||'');f.onsubmit=async e=>{e.preventDefault();try{const r=await bridge.apiPost('knowledge/save',{key:d.key,expected_revision:d.revision,category:f.elements.category.value,title:f.elements.title.value,content:f.elements.content.value,source:d.source,summary:f.elements.summary.value,status:f.elements.status.value});msg('已保存，修订 '+r.entry.revision);show(r.entry.id);load()}catch(x){msg(x.message||'保存失败，请重新读取')}};$('detail').replaceChildren(f)}catch(e){msg(e.message||'读取失败')}}$('search').onclick=load;$('refresh').onclick=load;(async()=>{bridge=window.AstrBotPluginView||window.AstrBotPluginPage;if(!bridge){msg('请从 AstrBot 插件页面入口打开');return}await bridge.ready();await load()})();
</script></body></html>
